name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mac-bridge:
    uses: ./.github/workflows/mac-bridge.yml

  build:
    needs: mac-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Mac 版橋接程式放進 public/tools/，跟 PPT-Web-Bridge.cmd 一起部署
      - uses: actions/download-artifact@v4
        with:
          name: mac-bridge
          path: public/tools
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
